name: Build & Create Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Binaries and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64

      - name: Build Linux Binary & Run Unit Tests
        run: |
          make clean
          make
          ./pktx_test

      - name: Build Windows Binary
        run: |
          make -f Makefile.win clean
          make -f Makefile.win CC=x86_64-w64-mingw32-gcc

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist
          cp pktx dist/pktx-linux-x86_64
          cp pktx.exe dist/pktx-windows-x86_64.exe

      - name: Release Tagged Version
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pktx-linux-x86_64
            dist/pktx-windows-x86_64.exe
          generate_release_notes: true

      - name: Release Latest Rolling Build (main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "pktx Latest Automated Build"
          prerelease: true
          files: |
            dist/pktx-linux-x86_64
            dist/pktx-windows-x86_64.exe
